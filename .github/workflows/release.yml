name: Release

# Releases were entirely manual: tag, archive by hand, upload, compute the
# checksum, paste it into the formula. Nothing verified that the tarball built,
# that the tag matched solis_poll.VERSION, or that the checksum was right.
#
# This builds the tarball, verifies it installs and builds exactly the way
# Homebrew will, and only then publishes the release. It is published rather than
# drafted because the asset has to be downloadable before the formula can point
# at it, and every check that would gate a manual review has already run.
#
# Updating the formula stays a separate, deliberate step: its sha256 can only be
# computed once the asset exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build
        required: true

permissions:
  contents: read

jobs:
  tarball:
    name: Build and verify the release tarball
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve and check the version
        id: version
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          version="$(./scripts/version.py)"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match solis_poll.VERSION ($version)" >&2
            exit 1
          fi
          ./scripts/version.py --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the tarball
        id: tarball
        run: |
          path="$(./scripts/package_release.sh "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.tag }}" | tail -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build from the tarball exactly as Homebrew will
        run: |
          workspace="$(mktemp -d)"
          tar -xzf "${{ steps.tarball.outputs.path }}" -C "$workspace"
          cd "$workspace/solis-tools-${{ steps.version.outputs.version }}"
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet .
          ./.venv/bin/solis-poll --version
          swift build --disable-sandbox --configuration release --package-path SolisMenuBar

      - name: Summarise what the formula needs
        run: |
          {
            echo "### solis-tools ${{ steps.version.outputs.version }}"
            echo
            echo "Update \`Formula/solis-tools.rb\` with:"
            echo
            echo '```ruby'
            echo '  url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/solis-tools-${{ steps.version.outputs.version }}.tar.gz"'
            echo '  sha256 "${{ steps.tarball.outputs.sha256 }}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          notes="$(mktemp)"
          {
            echo "Install or upgrade with Homebrew:"
            echo
            echo '```sh'
            echo "brew update && brew upgrade solis-tools"
            echo '```'
            echo
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for what changed."
            echo
            echo "Release asset sha256: \`$SHA256\`"
          } > "$notes"
          gh release create "$TAG" \
            "${{ steps.tarball.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --title "solis-tools $VERSION" \
            --notes-file "$notes"
