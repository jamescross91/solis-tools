name: Release

# Publication follows successful main CI, never an untrusted PR workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Merged release commit to retry
        required: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'

concurrency:
  group: release-${{ inputs.ref || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      released: ${{ steps.release.outputs.changed }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate merged release and successful CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$commit" \
            --event push --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
          changed="$(python scripts/release.py changed)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify and publish immutable archive
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish HEAD

  homebrew:
    name: Published Homebrew (${{ matrix.os }})
    needs: publish
    if: needs.publish.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f
      - name: Register release formula
        run: brew tap jamescross91/solis-tools "$GITHUB_WORKSPACE"
      - run: brew audit --strict --online jamescross91/solis-tools/solis-tools
      - run: brew install --build-from-source jamescross91/solis-tools/solis-tools
      - run: brew test jamescross91/solis-tools/solis-tools
