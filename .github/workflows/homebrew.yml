name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v

  menubar:
    name: macOS menu-bar build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Swift menu-bar app
        run: ./scripts/build_menubar_app.sh release
      - name: Validate JSON stream contract
        run: |
          swiftc -parse-as-library \
            SolisMenuBar/Sources/SolisMenuBar/Models.swift \
            SolisMenuBar/Validation/StreamContractValidation.swift \
            -o /tmp/solis-stream-contract
          /tmp/solis-stream-contract
      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict build/menubar/SolisMenuBar.app
          plutil -lint build/menubar/SolisMenuBar.app/Contents/Info.plist

  test:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4
      - name: Register repository as a tap
        run: brew tap jamescross91/solis-tools "${{ github.workspace }}"
      - name: Audit formula
        run: brew audit --strict --online jamescross91/solis-tools/solis-tools
      - name: Install formula
        run: brew install --build-from-source jamescross91/solis-tools/solis-tools
      - name: Test formula
        run: brew test jamescross91/solis-tools/solis-tools
